[project]
name = "pulsex"
version = "0.1.0"
description = "PulseX — daily AI tech news & research digest"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# backend is the only package. Without this, setuptools falls back to
# flat-layout auto-discovery, which treats every top-level directory as a
# candidate package and refuses to build when it finds more than one. The
# daily workflow commits data/seen_items.json, so the first successful run
# created a second top-level directory and broke the build for every run
# after it.
[tool.setuptools.packages.find]
include = ["backend*"]